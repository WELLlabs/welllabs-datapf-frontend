# Frontend pipeline - Build stage.
# Source: the data-platform repository. Output: the static build (build_output).
#
# Environment variables (set on the CodeBuild project by Terraform):
#   RUN_TESTS   "true" runs the Jest suite and stops the pipeline on failure.

version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - node --version && npm --version
      - npm ci --no-audit --no-fund
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - |
        if [ "${RUN_TESTS:-true}" = "true" ]; then
          CI=true npm test -- --watchAll=false
        else
          echo "RUN_TESTS=false: Jest suite skipped"
        fi
      # CI=false: react-scripts would otherwise fail the build on lint warnings.
      # No source maps: they would publish the full source code on CloudFront.
      - CI=false GENERATE_SOURCEMAP=false npm run build
      - test -s build/index.html || { echo "build/index.html missing"; exit 1; }
      - ls build/static/js/main.*.js >/dev/null || { echo "main bundle missing"; exit 1; }
      - echo "${CODEBUILD_RESOLVED_SOURCE_VERSION}" > build/release.txt

artifacts:
  base-directory: build
  files:
    - "**/*"
