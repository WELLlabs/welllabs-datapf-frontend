# Frontend pipeline - Deploy stage.
# Inputs: source_output (primary) and build_output ($CODEBUILD_SRC_DIR_build_output).
#
# Environment variables (set by Terraform):
#   FRONTEND_BUCKET   S3 bucket behind CloudFront
#   DISTRIBUTION_ID   CloudFront distribution
#   SITE_URL          https://<site domain> used for the smoke test
#
# Upload order keeps the live site consistent:
#   1. releases/<sha>/  full copy, used for rollback
#   2. static/          hashed JS/CSS/media, cached 1 year (old files kept so
#                       open browser tabs keep working)
#   3. other files      no-cache
#   4. index.html last  no-store, so it never points at assets not yet uploaded

version: 0.2

env:
  shell: bash

phases:
  build:
    commands:
      - set -euo pipefail
      - BUILD_DIR="$CODEBUILD_SRC_DIR_build_output"
      - RELEASE="$(cat "$BUILD_DIR/release.txt")"
      - RELEASE="${RELEASE:0:12}"
      - echo "Deploying frontend release $RELEASE to s3://$FRONTEND_BUCKET"
      - aws s3 sync "$BUILD_DIR" "s3://$FRONTEND_BUCKET/releases/$RELEASE/" --delete --only-show-errors
      - aws s3 sync "$BUILD_DIR/static" "s3://$FRONTEND_BUCKET/static/" --cache-control "public,max-age=31536000,immutable" --only-show-errors
      - aws s3 sync "$BUILD_DIR" "s3://$FRONTEND_BUCKET/" --exclude "static/*" --exclude "index.html" --cache-control "no-cache" --only-show-errors
      - aws s3 cp "$BUILD_DIR/index.html" "s3://$FRONTEND_BUCKET/index.html" --cache-control "no-store" --content-type "text/html; charset=utf-8" --only-show-errors
      - INVALIDATION_ID="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query 'Invalidation.Id' --output text)"
      - echo "Waiting for invalidation $INVALIDATION_ID"
      - aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$INVALIDATION_ID"
  post_build:
    commands:
      # Smoke test: home page, a deep route (SPA routing) and the release marker.
      - |
        set -euo pipefail
        curl -fsS -o /dev/null "$SITE_URL/"
        curl -fsS -o /dev/null "$SITE_URL/datasets"
        LIVE="$(curl -fsS "$SITE_URL/release.txt" | cut -c1-12)"
        [ "$LIVE" = "$RELEASE" ] || { echo "Live release $LIVE != $RELEASE"; exit 1; }
        echo "Frontend $RELEASE is live at $SITE_URL"
